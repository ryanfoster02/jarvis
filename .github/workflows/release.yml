# Release builds (Sprint 18). Runs only when the owner pushes a version tag (v0.2.0, …).
# It builds unsigned installers on macOS, Windows and Linux and attaches them to a DRAFT GitHub
# release. Nothing is public until the owner reviews the draft and presses "Publish release" —
# only then does JARVIS's update check see it. No secrets beyond the workflow's own GITHUB_TOKEN.
#
#   npm version minor      # bumps package.json and creates the tag v0.2.0
#   git push --follow-tags # starts this workflow
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the draft release and upload installers to it

concurrency:
  group: release-${{ github.ref }}

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
      - name: Create draft (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "JARVIS ${GITHUB_REF_NAME#v}" --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package: --mac
          - name: Windows
            os: windows-latest
            package: --win --x64
          - name: Linux
            os: ubuntu-latest
            package: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx electron-vite build
      - name: Bundle size
        run: npm run check:bundle
      - name: Package (unsigned)
        run: npx electron-builder ${{ matrix.package }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach installers to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*/*.dmg release/*/*.zip release/*/*.exe release/*/*.AppImage release/*/*.deb)
          if [ ${#files[@]} -eq 0 ]; then echo "No installers were built"; exit 1; fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
